name: ci

on:
  push:
    branches: [main, "feature/**", "fix/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event_go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: event_go/go.mod
          cache-dependency-path: event_go/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Race test
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event_go/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: event_go/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: event_go/go.mod
          cache-dependency-path: event_go/go.sum
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Component tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npx playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: event_go/test_reports
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event_go
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t event-go:smoke .
      - name: Run container
        run: |
          docker run -d --name event-go-smoke \
            -e APP_ENV=development \
            -p 8080:8080 \
            event-go:smoke
      - name: Assert non-root runtime user
        run: |
          uid=$(docker exec event-go-smoke id -u)
          test "$uid" != "0" || { echo "container runs as root (uid=0)"; exit 1; }
      - name: Smoke test probes
        run: sh ./scripts/smoke.sh http://127.0.0.1:8080
      - name: Show container logs on failure
        if: failure()
        run: docker logs event-go-smoke
      - name: Cleanup
        if: always()
        run: |
          docker stop event-go-smoke >/dev/null 2>&1 || true
          docker rm event-go-smoke >/dev/null 2>&1 || true
